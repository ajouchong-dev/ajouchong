services:
  database:
    image: postgres:14.12
    container_name: ajouchong-db
    environment:
      POSTGRES_DB: ajouchong
      POSTGRES_USER: chongchong
      POSTGRES_PASSWORD: chong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ajouchong-network

  backend:
    image: ajouchong-local:release
    container_name: ajouchong-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/ajouchong
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DIR: ${DIR}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      TOKEN_URI: ${TOKEN_URI}
      RESOURCE_URI: ${RESOURCE_URI}
      URI: ${URI}
      BUCKET_NAME: ${BUCKET_NAME}
      ACCESS_KEY: ${ACCESS_KEY}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - database
    ports:
      - "80:8080"
    networks:
      - ajouchong-network

volumes:
  postgres_data:

networks:
  ajouchong-network:
